<html>

        <title>Online Book Store Management System</title>

    </head>
    <body>
        <main>
            <header>
                <center>
                <h1>Online Book Store Management System</h1> <br>
                   
                </center>
            </header>
            <!-- Navigation Menu -->
             <center>
             <nav>
                <a href="home.html">Home</a>
                <a href="buyer.html">Buyer</a>
                <a href="seller.html">Seller</a>
                
             </nav>

             <section id="idsection">
                
                    <h3>Seller Register Here...</h3>
                    <form action="#" method = "post">
                        <div class = "form-container">
                        <label for="SellerName">Seller Name: </label>
                        <input type="text" 
                                id="Sellername" 
                                name="Sellername" 
                                placeholder="Enter the Seller Name" required> 
                        <label for="EmailID">Seller Email ID: </label>
                        <input type="email" 
                                id="email" 
                                name="Seller_email" 
                                placeholder="Enter the email" required> 
                        <label for="Password">Password</label>
                        <input type="password"
                                id="password"
                                name="password"
                                placeholder="Enter the Seller Password" required> 
                        <label for="seller_pho">Phone Number</label>
                        <input type="tel" id="sell_phone" name="seller_phone" required placeholder="enter phone number"> 

                        <label for="Address">Address</label>
                        <textarea name="address" id="address" placeholder="Enter address"></textarea> 

                        <label for="Aadhar">Aadhar Number</label>
                        <input type="text" id="aadhar" name="aadhar" required placeholder="enter aadhar number"> 

                        <label for="PAN">PanCard Number</label>
                        <input type="text" id="pan_card" name="pan_number" required placeholder="enter PanCard number"> 

                        <label for="GST number">GST Number</label>
                        <input type="text" id="GST" name="GST_no" required placeholder="enter GST number"> 




                        <label for="image">Upload Shope Image</label>
                        <input type="file" id="image" name="image" required> 

                        <label for="person_image">Upload Person Image</label>
                        <input type="file" id="person_img" name="person_image" required> 

                        <label for="image">Upload Shope Documents</label> 
                        <input type="file" id="Documents" name="Documents" required>  
                        </div>  
                        <input type="submit" id="login" name="Seller Register" value="Seller Register">
                                              
                    </form>
             </section>
        </main>
