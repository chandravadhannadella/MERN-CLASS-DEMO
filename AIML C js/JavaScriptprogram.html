        let title = document.getElementById("title");
        let btn = document.getElementById("btn");
        btn.addEventListener("click", function(){

         
            console.log(title.innerHTML);
            title.textContent = "Welcome to AIML C";
            title.style.color = "green";

        });

        let db_btn = document.getElementById("DBbtn");
        let output = document.getElementById("output");
        db_btn.addEventListener("dblclick", function(){
            output.textContent="Button on Double Clicked!";
        });

        db_btn.addEventListener("mouseenter", function(){
            db_btn.style.backgroundColor="Green";
            db_btn.style.fontSize = "20px";
            db_btn.style.color="white";
        });

        db_btn.addEventListener("mouseout", function(){
            db_btn.style.backgroundColor="gray";
            db_btn.style.fontSize = "10px";
            db_btn.style.color="Black";
        });
        let text =document.getElementById("text");
        let textoutput =document.getElementById("textoutput");
        text.addEventListener("keydown", function(event){
        textoutput.textContent = "Key : "+event.key;
        // textoutput.textContent = "Key : "+text.value;
    });

        let textpress =document.getElementById("textpress");
        let toutput = document.getElementById("toutput");
        textpress.addEventListener("keyup", function(){
        toutput.textContent = "Key : "+textpress.value;
    });

    let textele = document.getElementById("textele");
        let ulist = document.getElementById("ulist");
        textele.addEventListener("keyup", function(event){
            // Creating element
            let li = document.createElement("li");
            // Assign
            li.textContent=event.key;
