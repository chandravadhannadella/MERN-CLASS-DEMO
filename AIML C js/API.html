<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a HTML Program to implement api fetching data from json placeholder the category name is the users
            using Jquery</title>
    <script src="jquery-4.0.0.min.js"></script>
    <style>
         body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background: #f5f5f5;
        color: #333;
    }

    h1 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 20px;
    }

    #fetchBtn {
        display: block;
        margin: 0 auto 20px;
        padding: 10px 20px;
        font-size: 16px;
        background: #3498db;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    #fetchBtn:hover {
        background: #2980b9;
    }

    /* Default message style */
    #message {
        text-align: center;
        font-weight: bold;
        min-height: 20px;
        margin-bottom: 15px;
        color: #555;
    }

    /* Success message style (separate) */
    #message.success {
        color: #27ae60;
        background: #eafaf1;
        border: 1px solid #27ae60;
        padding: 8px 12px;
        border-radius: 4px;
        display: inline-block;
        font-size: 15px;
    }

    /* Error message style */
    #message.error {
        color: #c0392b;
        background: #fdedec;
        border: 1px solid #c0392b;
        padding: 8px 12px;
        border-radius: 4px;
        display: inline-block;
        font-size: 15px;
    }

    #users {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
        max-width: 1100px;
        margin: 0 auto;
    }

    .user-card {
        background: #fff;
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        border: 1px solid #e0e0e0;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .user-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .user-card h2 {
        margin: 0 0 10px;
        font-size: 18px;
        color: #2c3e50;
        border-bottom: 1px solid #eee;
        padding-bottom: 6px;
    }

    .user-card p {
        margin: 5px 0;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
    }

    .user-card p b {
        color: #555;
        margin-right: 4px;
    }

    </style>
</head>
<body>
    <h1>User Information</h1>
    <button id="fetchBtn"> Fetch Users  </button>
    <p id="message">Old Data</p>
    <div id="users"></div>
    <script>
        // Syntax Jquery -->
        // $(selector).Action()
        // try{} catch {}
        try{
            // jQuery click event
            $("#fetchBtn").click(async function() {
                // Clear previous data
                $("#message").text(" ");
                $("#users").empty();
                // Fetch data from API (Json Placeholder)
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                // Check HTTP response
                if(!response.ok) {
                    throw new Error(
                        "User Data to fetching Failed"+response.status
                    );
                }
                // convert response to JSON
                const users = await response.json();
                // Success message
                $("#message").text(`Users Data loading Successfully ${users.length}`)
                .addClass("success");
            // Display users
            users.forEach(function (user) {
                const UserHTML = `<div class="user-card">
                    <h2>${user.name} </h2>

                    <p><b>UserName</b>:${user.username} </p>
                    <p><b>Email</b>:${user.email} </p>
                    <p><b>Address</b>:${user.address.city} </p>
                    <p><b>Company</b>:${user.company.name} </p>
                    </div>
                    `;
                    $("#users").append(UserHTML);
            });

        });
            
        }catch (error)
        {
            
        }
        // jQuery click event
        // Clear previous data
        // Fetch data from API (Json Placeholder)
        // https://jsonplaceholder.typicode.com/users
        // Check HTTP response
        // convert response to JSON
        // Success message
        // Display users
        // Display error

    </script>
</body>
</html>
