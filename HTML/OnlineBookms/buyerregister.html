        <main>
            <header>
                <center>
                <h1>Online Book Store Management System</h1> <br>
                    <p>
                        <b>
                            <i>
                                BuyBook App
                            </i>
                        </b>
                    </p>
                </center>
            </header>
            <!-- Navigation Menu -->
             <center>
             <nav>
                <a href="home.html">Home</a>
                <a href="admin.html">Admin</a>
                <a href="seller.html">Seller</a>
                <a href="buyer.html">Buyer</a>
             </nav>
             </center>

             <section>
                <center>
                    <h3>Buyer Register Here...</h3>
                    <form action="#" method = "post">
                        <label for="BuyerName">Buyer Name: </label>
                        <input type="text" 
                                id="Buyername" 
                                name="Buyername" 
                                placeholder="Enter the Buyer Name" required> <br> <br>
                        <label for="EmailID">Buyer Email ID: </label>
                        <input type="email" 
                                id="email" 
                                name="Buyer_email" 
                                placeholder="Enter the email" required> <br> <br>
                        
                        <label for="Buyer_pho">Phone Number</label>
                        <input type="tel" id="sell_phone" name="Buyer_phone" required placeholder="enter phone number"> <br> <br>

                        <label for="Address">Address</label>
                        <textarea name="address" id="address" placeholder="Enter address"></textarea> <br> <br>

                        <label for="gender">Gender</label>
                        <input type="radio" name="Gender" value="Male" required>Male
                        <input type="radio" name="Gender" value="Female" required>Female <br> <br>

                       
                        <label for="person_image">Upload Person Image</label>
                        <input type="file" id="person_img" name="person_image" required> <br> <br>

                        <input type="submit" id="login" name="Buyer Register" value="Buyer Register">                        
                    </form>
                

                </center>
             </section>
        </main>
    </body>
